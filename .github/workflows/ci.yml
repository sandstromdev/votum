name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://root:ci-password@localhost:5432/local
      ORIGIN: http://localhost:5173
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters-long
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: local
        options: >-
          --health-cmd "pg_isready -U root -d local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun run db:migrate
      - run: bunx svelte-kit sync
      - run: bun run test:coverage
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bunx svelte-kit sync
      - run: bun run test:unit -- --run --project client
